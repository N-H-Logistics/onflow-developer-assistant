worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    error_log /dev/stderr info;

    sendfile on;
    keepalive_timeout 65;

    server {
        listen 8080;
        server_name _;
        absolute_redirect off;

        # Proxy Apidog data endpoints without redirecting them to /api-docs/.
        location ~ ^/api-[0-9]+\.data$ {
            proxy_pass https://565199.apidog.io;
            proxy_http_version 1.1;

            proxy_ssl_server_name on;
            proxy_ssl_name 565199.apidog.io;
            proxy_ssl_verify on;
            proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
            proxy_ssl_verify_depth 3;

            proxy_set_header Host 565199.apidog.io;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # /api-docs -> /api-docs/
        location = /api-docs {
            return 302 https://$host/api-docs/$is_args$args;
        }

        # Redirect Apidog page URLs directly to the published documentation.
        #
        # /api-9196581
        # -> https://api-oms-onflow.apidog.io/api-9196581
        #
        # /doc-123456
        # -> https://api-oms-onflow.apidog.io/doc-123456
        location ~ ^/((?:api|doc)-[0-9]+(?:/.*)?)$ {
            return 302 https://api-oms-onflow.apidog.io/$1$is_args$args;
        }

        # SEO files của Apidog
        location ~ ^/(llms\.txt|sitemap\.xml)$ {
            return 302 https://$host/api-docs/$1$is_args$args;
        }

        # Apidog
        location /api-docs/ {
            proxy_pass https://api-oms-onflow.apidog.io/;
            proxy_http_version 1.1;

            proxy_ssl_server_name on;
            proxy_ssl_name api-oms-onflow.apidog.io;
            proxy_ssl_verify on;
            proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
            proxy_ssl_verify_depth 3;

            proxy_set_header Host api-oms-onflow.apidog.io;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;

            proxy_redirect off;

            proxy_connect_timeout 30s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # Developer Portal
        location / {
            proxy_pass http://127.0.0.1:8000;

            proxy_http_version 1.1;
            proxy_buffering off;
            client_max_body_size 25m;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;

            proxy_connect_timeout 30s;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }
    }
}
